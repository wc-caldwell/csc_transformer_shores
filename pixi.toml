[workspace]
authors = ["wc-caldwell <clay.caldwell124@gmail.com>"]
channels = ["conda-forge", "r"]
name = "csc_transformer_shores"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
pip = ">=25.1.1,<26"
ipykernel = ">=6.29.5,<7"
jupyter = ">=1.1.1,<2"

[feature.py-env.dependencies]
python = "3.12.*"

[feature.py-env.pypi-dependencies]
scikit-learn = ">=1.9.1, <2"
torch = ">=2.10.0, <3"
torchvision = ">=0.25.0, <0.30"
astropy = ">=8.0.3, <9"
albumentationsx = { version = ">=2.6.6, <3", extras = ["headless"] }
transformers = ">=5.23.0, <6"
scikit-image = ">=0.26.0, <0.27"
pandas = ">=3.1.1, <4"
matplotlib = ">=3.11.2, <4"
autorank = ">=1.3.0, <2"

[feature.r-env.dependencies]
r-base = ">=4.3.3,<4.4"
r-tidyverse = ">=2.0.0,<3"
r-artool = ">=0.11.1,<0.12"

[environments]
py-env = ["py-env"]
r-env = ["r-env"]
